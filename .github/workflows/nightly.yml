name: Nightly Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Build zevMobile
        shell: msys2 {0}
        run: |
          mkdir -p build
          gcc -std=c11 -Wall -Wextra -O2 \
            emulator/main.c \
            emulator/phone.c \
            kernel/kernel.c \
            -o build/zevmobile.exe \
            -mwindows -lgdi32 -luser32

      - name: Create nightly release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "nightly-${{ github.run_number }}"
          gh release create $tag `
            build/zevmobile.exe `
            --title "zevMobile Nightly ${{ github.run_number }}" `
            --notes "Automated nightly build from commit ${{ github.sha }}." `
            --prerelease
