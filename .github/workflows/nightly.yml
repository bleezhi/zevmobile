name: Nightly Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Build zevMobile
        shell: msys2 {0}
        run: |
          mkdir -p build
          gcc -std=c11 -Wall -Wextra -O2 \
            emulator/main.c \
            emulator/phone.c \
            kernel/kernel.c \
            kernel/fs.c \
            kernel/process.c \
            kernel/syscall.c \
            -o build/zevmobile.exe \
            -mwindows -lgdi32 -luser32

      - name: Reset tags and create nightly release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = gh api --paginate repos/${{ github.repository }}/git/refs/tags --jq '.[].ref'
          foreach ($ref in ($tags -split "`n")) {
            if ($ref.Trim()) {
              gh api --method DELETE repos/${{ github.repository }}/git/$ref
            }
          }

          gh release delete nightly --yes --cleanup-tag 2>$null

          gh release create nightly `
            build/zevmobile.exe `
            --title "zevMobile Nightly" `
            --notes "Automated nightly build from commit ${{ github.sha }}." `
            --prerelease
