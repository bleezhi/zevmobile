name: Nightly Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
      - name: Build zevMobile
        shell: msys2 {0}
        run: |
          mkdir -p build
          gcc -std=c11 -Wall -Wextra -O2 \
            emulator/main.c emulator/phone.c \
            kernel/kernel.c kernel/fs.c kernel/process.c kernel/syscall.c \
            jvm/jvm.c jvm/launcher_class.c \
            -o build/zevmobile.exe \
            -mwindows -static -static-libgcc -static-libstdc++ -lgdi32 -luser32 -lwinmm
      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path build/zevmobile.exe)) { throw "EXE was not produced" }
          $size = (Get-Item build/zevmobile.exe).Length
          Write-Host "zevMobile EXE size: $size bytes"
          if ($size -lt 100000) { throw "EXE is unexpectedly small" }
      - name: Reset nightly release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>$null
          for ($i = 0; $i -lt 20; $i++) {
            gh release view nightly 2>$null
            if ($LASTEXITCODE -ne 0) { break }
            Start-Sleep -Seconds 1
          }
          gh release create nightly build/zevmobile.exe `
            --title "zevMobile Nightly" `
            --notes "Automated nightly build from commit ${{ github.sha }}." `
            --prerelease
